apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-commander-deployment
  labels:
    app: redis-commander
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-commander
  template:
    metadata:
      labels:
        app: redis-commander
    spec:
      containers:
      - name: redis-commander
        image: ghcr.io/joeferner/redis-commander:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"

        - name: REDIS_USERNAME
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_USER
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: REDIS_PASSWORD

        # Basic Authentication for Redis Commander
        - name: HTTP_USER
          valueFrom:
            secretKeyRef:
              name: redis-http-secret
              key: HTTP_USER
        - name: HTTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-http-secret
              key: HTTP_PASSWORD

        ports:
        - name: http
          containerPort: 8081
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
