apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-deployment-2
  labels:
    app: nginx-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
      - name: nginx-demo-container
        image: nginxdemos/hello
        ports:
        - containerPort: 80
