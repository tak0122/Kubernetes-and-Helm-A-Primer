apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: mongodb
        image: mongo:4.4
        volumeMounts:
        - name: vol
          mountPath: /data/db

      volumes:
      - name: vol
        persistentVolumeClaim:
          claimName: pvc-data   # claimName is PVC name.
