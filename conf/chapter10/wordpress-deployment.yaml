apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-deployment
  labels:
    app: wordpress
    tier: frontend
spec:
  selector:
    matchLabels:
      app: wordpress
      tier: frontend
  template:
    metadata:
      labels:
        app: wordpress
        tier: frontend
    spec:
      containers:
      - image: wordpress:6.8
        name: wordpress
        ports:
        - containerPort: 80
          name: wordpress
        env:
        - name: WORDPRESS_DB_HOST
          value: "mariadb-service:3306"
        - name: WORDPRESS_DB_NAME
          value: "wordpress_database"
        - name: WORDPRESS_DB_USER
          value: "wordpress_user"
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-passwords   # kubectl get secret
              key: mariadb-user-password
        volumeMounts:
        - name: vol
          mountPath: /var/www/html 
      volumes:
      - name: vol
        persistentVolumeClaim:
          claimName: wordpress-pvc
